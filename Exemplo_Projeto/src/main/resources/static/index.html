<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laboratorio de Decisao Automovel</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
    <div>
        <p class="eyebrow">Protótipo académico</p>
        <h1>Laboratório de decisão automóvel</h1>
    </div>
    <div class="system-state"><span class="state-dot"></span> Simulação local</div>
</header>

<main>
    <section class="workspace consultation" aria-labelledby="input-title">
        <div class="section-heading consultation-heading">
            <div>
                <p class="step">01 / Consulta</p>
                <h2 id="input-title">Avaliação dos sensores</h2>
            </div>
            <fieldset class="engine-choice">
                <legend>Motor de inferência</legend>
                <label><input type="radio" name="engine" value="both" checked><span>Ambos</span></label>
                <label><input type="radio" name="engine" value="prolog"><span>Prolog</span></label>
                <label><input type="radio" name="engine" value="drools"><span>Drools</span></label>
            </fieldset>
        </div>
        <div class="progress-row">
            <span id="question-progress">Pergunta 1</span>
            <button class="text-button" type="button" id="restart-button">Recomeçar</button>
        </div>
        <div class="progress-track"><span id="progress-bar"></span></div>
        <div class="consultation-body">
            <figure class="scenario-panel" aria-labelledby="scenario-title">
                <figcaption>
                    <span id="scenario-title">Cenário atual</span>
                    <small id="scenario-caption">À espera dos dados da via</small>
                </figcaption>
                <div id="road-scene" class="road-scene" aria-label="Representação visual do cenário">
                    <div id="road" class="road"></div>
                    <div id="scene-obstacle" class="scene-object obstacle" hidden><span></span></div>
                    <div id="scene-person" class="scene-object person" hidden><span>●</span></div>
                    <div id="scene-car" class="scene-car"><i></i><b></b></div>
                    <div id="rain-layer" class="rain-layer" hidden></div>
                </div>
                <div id="scene-legend" class="scene-legend"></div>
            </figure>
            <form id="question-form" class="question-stage">
                <p id="question-source" class="sensor-source"></p>
                <h3 id="question-text"></h3>
                <p id="question-help" class="question-help"></p>
                <div id="answer-control" class="answer-control"></div>
                <div class="question-actions">
                    <button class="secondary" type="button" id="back-button">Anterior</button>
                    <button class="primary" type="submit" id="next-button">Continuar</button>
                </div>
            </form>
        </div>
        <div id="answer-summary" class="answer-summary" aria-live="polite"></div>
    </section>

    <section id="results" class="results" aria-live="polite" hidden>
        <div class="section-heading result-heading">
            <div>
                <p class="step">02 / Resultado</p>
                <h2>Comparação dos motores</h2>
            </div>
            <div id="agreement" class="agreement"></div>
        </div>
        <div id="engine-results" class="engine-results"></div>
    </section>

    <section class="knowledge" aria-labelledby="knowledge-title">
        <div class="section-heading">
            <div>
                <p class="step">Base de conhecimento</p>
                <h2 id="knowledge-title">Dezoito regras partilhadas</h2>
            </div>
            <span id="kb-version" class="version">A carregar</span>
        </div>
        <div id="rules-table" class="rules-table"></div>
    </section>
</main>

<template id="engine-template">
    <article class="engine-panel">
        <div class="engine-header"><h3></h3><span class="time"></span></div>
        <p class="decision-label">Decisão selecionada</p>
        <p class="decision"></p>
        <div class="conflicts"></div>
        <details class="why-details">
            <summary>Why: por que foi tomada esta decisão?</summary>
            <p class="explanation"></p>
            <h4>Regras ativas</h4>
            <div class="active-rules"></div>
        </details>
        <details class="why-not-details">
            <summary>Why not: por que não foram escolhidas outras decisões?</summary>
            <div class="inactive-rules"></div>
        </details>
    </article>
</template>

<script src="/app.js" defer></script>
</body>
</html>
